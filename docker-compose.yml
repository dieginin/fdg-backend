services:
  db:
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      timeout: 5s
    image: postgres:19.0-alpine3.24
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - ${DB_PORT}:${DB_PORT}

volumes:
  postgres-data:
    driver: local
